<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="logo">PLANIFICADOR <span>2026</span></div>
        <div class="year-nav">
            <button class="year-arrow" id="prev-year">«</button>
            <div class="year-badge">2026</div>
            <button class="year-arrow" id="next-year">»</button>
        </div>
        <div class="hdr-right">
            <div class="hamburger-wrap">
                <button class="hamburger-btn" id="menu-toggle">
                    <span></span><span></span><span></span>
                </button>
                <div class="hamburger-menu" id="main-menu">
                    <div class="hm-section-label">Editor</div>
                    <button class="hm-item" id="btn-download-json">Descargar data.json actualizado</button>
                    <div class="hm-divider"></div>
                    <div class="hm-section-label">Acciones</div>
                    <button class="hm-item" id="btn-export-pdf">Exportar PDF</button>
                    <button class="hm-item" id="btn-clear-all">Limpiar (Local)</button>
                </div>
            </div>
        </div>
    </header>

    <main class="layout" id="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header expanded">
                <div class="form-body">
                    <input type="text" id="project-name" placeholder="Nombre del proyecto...">
                    <button class="btn-create" id="add-project-btn">+ Crear Proyecto</button>
                </div>
            </div>
            <div class="cards-list" id="project-list"></div>
        </aside>

        <section class="calendar-area">
            <div class="months-grid" id="months-grid"></div>
        </section>
    </main>

    <div class="modal-overlay" id="day-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">×</button>
            <h2 id="modal-title"></h2>
            <div class="modal-body">
                <div class="task-form">
                    <input type="text" id="tf-name" placeholder="Nueva tarea...">
                    <button class="task-form-add" id="task-add-btn">Agregar</button>
                </div>
                <div class="tasks-container" id="day-tasks-list"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

    <script src="js/firebase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
